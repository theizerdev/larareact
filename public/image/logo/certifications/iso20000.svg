<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Outer circle border -->
  <circle cx="70" cy="70" r="64" fill="#ffffff" stroke="#0066b2" stroke-width="4.5"/>
  <circle cx="70" cy="70" r="57" fill="none" stroke="#0066b2" stroke-width="1.5" stroke-dasharray="3,2"/>
  
  <!-- Curved text top: International Organization for Standardization -->
  <path id="textArcTop" fill="none" d="M 18 70 A 52 52 0 1 1 122 70" />
  <text font-family="Arial, sans-serif" font-size="7.5" font-weight="600" fill="#0066b2" letter-spacing="0.4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      International Organization for Standardization
    </textPath>
  </text>
  
  <!-- ISO Box in Center -->
  <rect x="34" y="46" width="72" height="34" rx="4" fill="#0066b2"/>
  <text x="70" y="71" font-family="'Arial Black', Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ISO</text>
  
  <!-- Number at bottom -->
  <text x="70" y="105" font-family="'Arial Black', Arial, sans-serif" font-size="17" font-weight="900" fill="#0066b2" text-anchor="middle" letter-spacing="1">20000</text>
</svg>
