<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <g transform="translate(10, 10)">
    <!-- OEA Stylized Text -->
    <text x="90" y="42" text-anchor="middle">
      <tspan font-family="'Arial Black', Arial, sans-serif" font-size="44" font-weight="900" fill="#15803d">o</tspan>
      <tspan font-family="'Arial Black', Arial, sans-serif" font-size="44" font-weight="900" fill="#dc2626">e</tspan>
      <tspan font-family="'Arial Black', Arial, sans-serif" font-size="44" font-weight="900" fill="#15803d">a</tspan>
    </text>

    <!-- Subtitle: Operador Económico Autorizado -->
    <text x="90" y="58" font-family="'Arial Black', Arial, sans-serif" font-size="10" font-weight="800" fill="#334155" text-anchor="middle" letter-spacing="0.2">Operador Económico</text>
    <text x="90" y="70" font-family="'Arial Black', Arial, sans-serif" font-size="10" font-weight="800" fill="#334155" text-anchor="middle" letter-spacing="0.2">Autorizado</text>

    <!-- MEXICO with dots -->
    <g transform="translate(90, 81)">
      <!-- Left dots -->
      <circle cx="-38" cy="-3" r="2.5" fill="#15803d"/>
      <circle cx="-30" cy="-3" r="2.5" fill="#0284c7"/>
      
      <!-- Text MEXICO -->
      <text x="0" y="0" font-family="'Arial Black', Arial, sans-serif" font-size="9" font-weight="900" fill="#0284c7" text-anchor="middle" letter-spacing="2.5">MÉXICO</text>
      
      <!-- Right dots -->
      <circle cx="30" cy="-3" r="2.5" fill="#0284c7"/>
      <circle cx="38" cy="-3" r="2.5" fill="#15803d"/>
    </g>
  </g>
</svg>
